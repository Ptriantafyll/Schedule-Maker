server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fallback to index.html for Flutter client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 1. Never cache entrypoint HTML
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 2. Never cache bootstrap loader, service worker or version manifest
    location ~* (flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        expires -1;
    }

    # 3. Revalidate JS/WASM bundles via ETag on every load (Flutter bundles are not content-hashed)
    location ~* \.(js|mjs|wasm)$ {
        add_header Cache-Control "no-cache";
    }

    # 4. Cache optimization for static assets (CSS, images, fonts)
    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
