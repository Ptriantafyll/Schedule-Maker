server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: fallback to index.html for Flutter client routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache optimization for static assets (JavaScript, WebAssembly, fonts, icons)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
